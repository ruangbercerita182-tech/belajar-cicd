name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Build
        run: go build -o belajar-cicd .

      - name: Test
        run: go test -v ./...

      - name: Upload binary
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: belajar-cicd-linux-amd64
          path: belajar-cicd
          if-no-files-found: error
          retention-days: 7
